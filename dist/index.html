<!doctype html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<title>GitHub 发现器</title>
<style>
 /* 颜色全部走变量：浅色是默认，深色只是一层覆盖 */
 :root{color-scheme:light;
   --bg:#ffffff; --panel:#f6f8fa; --panel2:#eaeef2; --line:#d0d7de; --txt:#1f2328;
   --dim:#656d76; --acc:#0969da; --hot:#bc4c00; --good:#1a7f37; --warn:#9a6700; --bad:#cf222e;
   --chip:#ddf4ff; --chipTxt:#0a5394; --ok:#dafbe1; --okTxt:#1a7f37; --rail:#f6f8fa; --input:#ffffff}
 :root[data-theme="dark"]{color-scheme:dark;
   --bg:#0d1117; --panel:#161b22; --panel2:#21262d; --line:#30363d; --txt:#e6edf3;
   --dim:#8d96a0; --acc:#4493f8; --hot:#f78166; --good:#3fb950; --warn:#f0883e; --bad:#f85149;
   --chip:#1f2937; --chipTxt:#9ecbff; --ok:#132f25; --okTxt:#7ee787; --rail:#0b0f14; --input:#0b0f14}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--txt);
   font:15px/1.55 -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif}
 .app{display:grid;grid-template-columns:64px 1fr;min-height:100vh}

 .rail{border-right:1px solid var(--line);background:var(--rail);display:flex;flex-direction:column;
   align-items:center;padding:12px 0;gap:6px;position:sticky;top:0;height:100vh}
 .rail button{width:46px;height:46px;border:0;background:transparent;color:var(--dim);
   border-radius:10px;font-size:10.5px;cursor:pointer;display:flex;flex-direction:column;
   align-items:center;justify-content:center;gap:2px;padding:0;font-family:inherit}
 .rail button .ic{font-size:17px;line-height:1}
 .rail button.on{background:color-mix(in srgb, var(--acc) 16%, transparent);color:var(--acc)}
 .rail .sp{flex:1}

 main{min-width:0;padding:0 22px 70px}
 .top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;
   border-bottom:1px solid var(--line);margin-bottom:14px}
 .row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
 h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
 .search{flex:1;min-width:180px;display:flex;gap:6px}
 .search input{flex:1;background:var(--input);border:1px solid var(--line);color:var(--txt);
   border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;outline:none}
 .search input:focus{border-color:var(--acc)}
 .tabs{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
 .tabs button{border:0;background:transparent;color:var(--dim);padding:5px 12px;border-radius:999px;
   font:inherit;font-size:13px;cursor:pointer;font-family:inherit}
 .tabs button.on{background:var(--panel);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
 .meta{color:var(--dim);font-size:12px;margin:12px 0}
 .meta b{color:var(--txt)}
 .meta a{color:var(--acc)}

 .grid{columns:2;column-gap:14px}
 @media (max-width:900px){.grid{columns:1}}
 .card,.panel{break-inside:avoid;background:var(--panel);border:1px solid var(--line);
   border-radius:12px;padding:13px 14px;margin:0 0 14px;position:relative}
 .card.dim{opacity:.55}
 .nm{font-size:15px;font-weight:650;margin:0;line-height:1.35}
 .nm a{color:var(--acc);text-decoration:none;word-break:break-all}
 .ln{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0;font-size:11px;color:var(--dim)}
 .tag{background:var(--panel2);border-radius:4px;padding:1px 6px}
 .tag.p{color:var(--good);background:var(--ok)}
 .tag.e{color:#8250df;background:color-mix(in srgb,#8250df 14%,transparent)}
 .tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
 .tag.spam{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
 .ds{margin:8px 0 0;color:var(--txt);font-size:13.5px}
 .orig{margin:4px 0 0;color:var(--dim);font-size:11.5px}
 .chips{margin:8px 0 0}
 .chips span{display:inline-block;background:var(--chip);color:var(--chipTxt);border-radius:999px;
   padding:0 8px;font-size:11px;margin:0 5px 5px 0}
 .st{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--dim)}
 .st b{color:var(--txt);font-weight:600}
 .curve{margin-top:9px;background:var(--bg);border-radius:8px;padding:7px 9px}
 .spark rect{fill:var(--hot)} .spark .last{fill:var(--good)}
 .why{margin-top:8px;font-size:11.5px;color:var(--dim)}
 .why i{font-style:normal;background:var(--ok);color:var(--okTxt);border-radius:4px;
   padding:1px 6px;margin:0 5px 5px 0;display:inline-block}
 .why i.neg{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
 .why i.na{background:var(--panel2);color:var(--dim)}
 .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;opacity:.55;transition:opacity .12s}
 .card:hover .acts{opacity:1}
 .acts button{border:1px solid var(--line);background:var(--bg);color:var(--txt);border-radius:6px;
   padding:2px 8px;font-size:11.5px;cursor:pointer;font-family:inherit}
 .acts button:hover{background:var(--panel2)}
 .acts button.done{border-color:var(--acc);color:var(--acc)}
 .like{position:absolute;top:10px;right:12px;font-size:11.5px;color:var(--dim)}
 .menu{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line);
   border-radius:8px;padding:5px;display:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
 .menu div{padding:5px 10px;font-size:12.5px;border-radius:5px;cursor:pointer;white-space:nowrap}
 .menu div:hover{background:var(--panel2)}
 .empty{padding:50px;text-align:center;color:var(--dim)}
 .more{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;
   padding:6px 16px;font:inherit;font-size:13px;cursor:pointer;font-family:inherit}
 .more:hover{background:var(--panel2)}
 h3{font-size:14px;margin:18px 0 6px}
 .set{display:flex;align-items:center;justify-content:space-between;gap:14px;
   padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
 .set small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px;max-width:520px}
 .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
 .seg button{border:0;background:var(--bg);color:var(--dim);padding:4px 12px;font:inherit;font-size:12.5px;cursor:pointer;font-family:inherit}
 .seg button.on{background:var(--acc);color:#fff}
 input.url{background:var(--input);border:1px solid var(--line);color:var(--txt);border-radius:6px;
   padding:4px 8px;font-size:12px;width:300px;font-family:ui-monospace,Consospace,monospace}
 .dbg{color:var(--dim);font-size:11px;margin-top:16px;word-break:break-all;opacity:.7}
 code{font-family:ui-monospace,Consolas,monospace;font-size:12px}

 /* 顶部信息条：这个产品是被配额驱动的，"上次什么时候采的"必须一眼可见 */
 .strip{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);
   border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:12.5px;color:var(--dim)}
 .strip b{color:var(--txt)}
 .strip .grow{flex:1}
 .strip .btn{border:1px solid var(--line);background:var(--bg);color:var(--txt);border-radius:6px;
   padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit}
 .strip .btn:hover{background:var(--panel2)}
 .strip .warn{color:var(--warn)}

 /* 首条大卡：一屏里必须有一个视觉落点，否则 40 张同构卡片就是墙 */
 .hero{padding:18px 20px}
 .hero .nm{font-size:19px}
 .hero .ds{font-size:14.5px;margin-top:9px}
 .hero .st{font-size:13px}
 .hero .spark rect{fill:var(--good)}
 .hero .big{font-size:15px;font-weight:650;color:var(--txt)}

 .seen{color:var(--dim);font-size:11px}
 .sk{height:132px;border-radius:12px;margin-bottom:14px;
   background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 37%,var(--panel) 63%);
   background-size:400% 100%;animation:sk 1.2s ease infinite}
 @keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}

 /* README 是 GitHub 渲染的 HTML，不带我们的样式；不补这一段它会像裸文本 */
 .md{font-size:14px;line-height:1.7;color:var(--txt)}
 .md h1,.md h2,.md h3,.md h4{margin:18px 0 8px;line-height:1.3;font-weight:650}
 .md h1{font-size:19px;border-bottom:1px solid var(--line);padding-bottom:5px}
 .md h2{font-size:17px;border-bottom:1px solid var(--line);padding-bottom:4px}
 .md h3{font-size:15px}
 .md p{margin:9px 0}
 .md ul,.md ol{margin:9px 0;padding-left:24px}
 .md li{margin:3px 0}
 .md img{max-width:100%;height:auto;border-radius:6px}
 .md a{color:var(--acc)}
 .md code{background:var(--panel2);padding:1px 5px;border-radius:5px}
 .md pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto}
 .md pre code{background:none;padding:0}
 .md blockquote{margin:10px 0;padding:2px 12px;border-left:3px solid var(--line);color:var(--dim)}
 .md table{border-collapse:collapse;margin:10px 0;font-size:13px;width:100%}
 .md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left}
 .md th{background:var(--panel2)}
 .md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <button data-v="feed" class="on" onclick="view('feed',this)"><span class="ic">◎</span>发现</button>
    <button data-v="saved" onclick="view('saved',this)"><span class="ic">★</span>收藏</button>
    <button data-v="stats" onclick="view('stats',this)"><span class="ic">▤</span>统计</button>
    <button data-v="set" onclick="view('set',this)"><span class="ic">⚙</span>设置</button>
    <span class="sp"></span>
    <button onclick="toggleTheme()" title="切换黑白"><span class="ic" id="tIc">◐</span>主题</button>
    <button onclick="toggleDbg()"><span class="ic">⌗</span>调试</button>
  </nav>
  <main>
    <div class="top">
      <div class="row1">
        <h1>GitHub 发现器</h1>
        <div class="search">
          <input id="q" placeholder="搜你想看的（回车：这个词会进你的兴趣画像）" onkeydown="if(event.key==='Enter')doSearch()">
          <button class="more" onclick="doSearch()">搜索</button>
        </div>
      </div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="strip" id="strip">读取中…</div>
    <div class="meta" id="meta">加载中…</div>
    <div id="body"></div>
    <div class="dbg" id="dbg" style="display:none"></div>
  </main>
</div>
<div class="menu" id="menu"></div>
<script>
const T = window.__TAURI__;
const J = m => { try { if (T) T.core.invoke('js_log', { msg: new Date().toISOString().slice(11,19) + ' ' + m }); } catch(e){} };
window.addEventListener('error', e => J('JSERR ' + e.message + ' @' + (e.lineno||'?')));
const call = (c, a) => T ? T.core.invoke(c, a) : Promise.reject(new Error('非 Tauri 环境'));
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const SESSION = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7);
const LIMIT = 40;
let CH = 'hot', shown = 0, dbgOn = false;
let SET = { theme:'light', translate_on:'0', lang:'zh-CN', translate_url:'' };
const TR = new Map();                       // 会话内译文缓存，避免同一段话翻两次
const TABS = [['hot','热度'],['profile','画像'],['explore','探索'],['saved','收藏']];

function applyTheme(){
  document.documentElement.dataset.theme = SET.theme === 'system'
    ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : SET.theme;
  document.getElementById('tIc').textContent = document.documentElement.dataset.theme === 'dark' ? '☾' : '☀';
}
function toggleTheme(){ set('theme', (document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark')); }
async function set(k, v){
  SET[k] = String(v); applyTheme();
  try{ await call('set_setting_cmd', { key:k, value:String(v) }); }catch(e){ J('set FAIL '+e); }
  if (k === 'translate_on' && v === '1') translateVisible();
  if (document.getElementById('body').dataset.v === 'set') settingsView();
}
function toggleDbg(){ dbgOn = !dbgOn; document.getElementById('dbg').style.display = dbgOn ? '' : 'none'; }
function dbg(t){ const d=document.getElementById('dbg'); if(d&&dbgOn) d.textContent='[dbg] '+t; }

function tabs(){
  const C = window.__C || {};
  document.getElementById('tabs').innerHTML = TABS.map(t => {
    const n = C[t[0]] ?? 0;
    return `<button class="${t[0]===CH?'on':''}" onclick="tab('${t[0]}')">${t[1]}<span class="n">${n}</span></button>`;
  }).join('');
}

function ago(ts){
  if (!ts) return '从未';
  const m = Math.round((Date.now()/1000 - ts) / 60);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  if (m < 1440) return Math.round(m/60) + ' 小时前';
  return Math.round(m/1440) + ' 天前';
}

async function counts(){
  try { window.__C = await call('get_counts', {}); tabs(); renderStrip(); }
  catch(e){ J('counts FAIL ' + e); }
}

function renderStrip(){
  const el = document.getElementById('strip'); if (!el) return;
  const C = window.__C || {}, S = window.__S || {};
  const stale = !C.last_collect || (Date.now()/1000 - C.last_collect) > 6*3600;
  el.innerHTML =
    '上次采集 <b>' + ago(C.last_collect) + '</b>' +
    (stale ? ' <span class="warn">· 数据已过期，热度榜会重复</span>' : '') +
    ' · 候选池 <b>' + (C.all ?? '—') + '</b>' +
    ' · 已测增速 <b>' + (C.hot ?? '—') + '</b> 热度 / <b>' + (C.profile ?? 0) + '</b> 画像 / <b>' + (C.explore ?? 0) + '</b> 探索' +
    ' · 收藏 <b>' + (C.saved ?? 0) + '</b>' +
    (S.login ? ' · <b>@' + esc(S.login) + '</b>' : ' · <span class="warn">未登录（匿名 60 次/小时）</span>') +
    '<span class="grow"></span>' +
    '<button class="btn" onclick="refresh(this)">采集新数据</button>' +
    '<button class="btn" onclick="mine(this)">按我的口味重建画像</button>';
}
function tab(c){ CH=c; shown=0; document.getElementById('body').innerHTML=''; tabs(); load(); }
function view(v, btn){
  shown = 0; document.getElementById('body').innerHTML='';
  document.querySelectorAll('.rail button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v===v));
  const tabsEl = document.getElementById('tabs');
  if (v === 'feed' || v === 'saved') { CH = v === 'feed' ? 'hot' : 'saved'; tabs(); tabsEl.style.display=''; load(); }
  else { tabsEl.style.display='none'; if (v==='stats') statsView(); else settingsView(); }
}

function spark(w){
  if(!w || !w.length) return '';
  const a=w.slice(0,8).reverse(), max=Math.max(...a,1), step=20;
  const bars=a.map((v,i)=>{const h=Math.max(2,v/max*30);
    return `<rect class="${i===a.length-1?'last':''}" x="${i*step}" y="${32-h}" width="14" height="${h}" rx="2"/>`}).join('');
  return `<div class="curve"><svg class="spark" width="${a.length*step}" height="34">${bars}</svg>
    <div class="st"><span>周峰值 <b>+${max.toLocaleString()}</b> · ${a.length} 周</span></div></div>`;
}
function card(c, i){
  const why=(c.why||[]).map(t=>{const cls=/降权|不成比例/.test(t)?'neg':(/不足|尚未/.test(t)?'na':'');
    return `<i class="${cls}">${esc(t)}</i>`}).join('');
  const chan=c.channel==='profile'?'<span class="tag p">画像</span>':c.window==='explore'?'<span class="tag e">探索</span>':'';
  const hero = i === 0 ? ' hero' : '';
  return `<article class="card${hero}" data-id="${c.id}" data-slot="${i}" data-chan="${esc(c.channel)}" data-desc="${esc(c.description||'')}">
    <div class="like">${c.saved?'★ 已收藏':''}</div>
    <h2 class="nm"><a href="#" onclick="openRepo(this,${c.id},'${esc(c.url)}');return false">${esc(c.full_name)}</a></h2>
    <div class="ln">${chan}<span class="tag">出生 ${c.age_days} 天</span>
      ${dbgOn ? `<span class="tag">score ${c.score.toFixed(3)}</span>` : ''}
      ${c.seen ? '<span class="seen">看过了</span>' : '<span class="tag p">未看过</span>'}
      ${c.spam?'<span class="tag spam">降权</span>':''}${c.slope==null?'<span class="tag warn">斜率未知</span>':''}</div>
    <p class="ds">${esc(c.description)||'<span class="tag">（无简介）</span>'}</p>
    <div class="chips">${(c.topics||[]).slice(0,5).map(t=>`<span>${esc(t)}</span>`).join('')}</div>
    <div class="st"><span><b>${c.stars.toLocaleString()}</b> star</span><span><b>${c.forks}</b> fork</span>
      <span><b>${c.subscribers}</b> watch</span><span><b>${c.open_issues}</b> issue</span>
      <span>日均 <b>${c.slope==null?'—':c.slope.toFixed(0)}</b></span></div>
    ${spark(c.weeks)}
    <div class="why">${why}</div>
    <div class="acts">
      <button onclick="saveRepo(this,${c.id})">${c.saved?'已收藏':'收藏'}</button>
      <button onclick="hideMenu(event,${c.id},this)">不感兴趣</button>
      <button onclick="ext(this,'open_in_browser',${c.id},'${esc(c.url)}')">浏览器打开</button>
      <button onclick="ext(this,'copy_clone',${c.id},'git clone ${esc(c.url)}.git')">clone</button>
    </div>
  </article>`;
}

// ---------- 翻译：只翻简介。项目名是专有名词，翻成中文只会更难认
async function translateVisible(){
  if (SET.translate_on !== '1') return;
  const cards = [...document.querySelectorAll('[data-desc]')];
  const need = [...new Set(cards.map(c=>c.dataset.desc).filter(d=>d && d.length>3 && !TR.has(d)))].slice(0, 8);
  if (!need.length) { cards.forEach(applyTr); return; }
  try{
    const r = await call('do_translate', { texts: need });
    Object.entries(r.map || {}).forEach(([k,v]) => TR.set(k, v));
    J(`translate net=${r.net} cached=${r.cached}`);
    cards.forEach(applyTr);
  }catch(e){ J('translate FAIL '+e); }
}
function applyTr(el){
  const src = el.dataset.desc; if(!src || !TR.has(src)) return;
  const zh = TR.get(src); if(!zh || zh === src) return;
  const p = el.matches('.ds') ? el : el.querySelector('.ds');
  if (!p || p.dataset.tr === '1') return;
  p.dataset.tr = '1';
  p.innerHTML = esc(zh) + `<div class="orig">原文：${esc(src)}</div>`;
}

let io=null, timers={};
function observe(){
  if(!T || !('IntersectionObserver' in window)) return;
  if(io) io.disconnect(); timers={};
  io=new IntersectionObserver(async es=>{
    for(const e of es){
      const el=e.target, id=el.dataset.id;
      if(e.isIntersecting){
        if(el.dataset.counted||timers[id]) continue;
        timers[id]=setTimeout(async()=>{ el.dataset.counted='1';
          try{ await call('log_impression',{repoId:+id,slot:+el.dataset.slot,channel:el.dataset.chan,session:SESSION}); }
          catch(err){ J('impression FAIL '+err); } },1000);
      } else if(timers[id]){ clearTimeout(timers[id]); delete timers[id]; }
    }
  },{threshold:.5});
  const cs=document.querySelectorAll('.card[data-id]');
  cs.forEach(c=>io.observe(c));
  J(`observe ${cs.length} chan=${CH}`);
  translateVisible();
}

async function load(){
  const box=document.getElementById('body');
  if (!shown) box.innerHTML = '<div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
  counts();
  try{
    const list = T ? await call('get_channel',{channel:CH,limit:LIMIT,offset:shown}) : [];
    if(!list.length && shown===0){
      box.innerHTML = CH==='saved' ? '<div class="empty">还没有收藏。发现页点"收藏"就进这里。</div>'
        : CH==='explore' ? '<div class="empty">探索池是空的 —— 去设置里点"取一批新生项目"</div>'
        : '<div class="empty">榜是空的</div>';
      document.getElementById('meta').textContent=''; return;
    }
    shown += list.length;
    const old = box.querySelector('.grid');
    if (old) old.insertAdjacentHTML('beforeend', list.map((c,i)=>card(c, shown-list.length+i)).join(''));
    else box.innerHTML = `<div class="grid">${list.map((c,i)=>card(c,i)).join('')}</div>
      <button class="more" style="display:block;margin:6px auto" onclick="load()">加载更多（已显示 ${shown}）</button>`;
    observe();
  }catch(e){ box.innerHTML=`<div class="empty">取不到：${esc(String(e))}</div>`; J('load FAIL '+e); }
  stats(); dbg(`channel=${CH} shown=${shown}`);
}

async function saveRepo(btn,id){
  try{
    const r=await call('log_event',{kind:'star_in_app',repoId:id});
    btn.textContent='已收藏'; btn.classList.add('done');
    const learned=(r&&r.learned)||[];
    document.getElementById('meta').innerHTML = learned.length

// 图片诊断：外部猜不如让页面自己报。区分"被拦"（fetch 抛 TypeError）与"取不到"（有响应但非 2xx）
async function diagImgs(){
  const imgs = [...document.querySelectorAll('#rd img')];
  if (!imgs.length) { J('imgdiag: README 里没有 img'); return; }
  // 在打开的那一刻读状态没有意义（图还在飞），所以等 4 秒读"落定"后的结果
  await new Promise(r => setTimeout(r, 4000));
  const rows = imgs.map(i => ({ src: i.currentSrc || i.src, ok: i.complete && i.naturalWidth > 0 }));
  const ok = rows.filter(r => r.ok).length;
  const local = rows.filter(r => r.src && r.src.includes('tauri.localhost')).length;
  J(`imgdiag settled total=${imgs.length} ok=${ok} 指向本站=${local}`);
  const bad = rows.filter(r => !r.ok).slice(0, 3).map(r => r.src.slice(0, 70));
  if (bad.length) J('imgdiag 未出图样本: ' + bad.join(' , '));
}
async function flushDwell(){
  if (!curDetail) return;
  const ms = Date.now() - dwellStart;
  if (ms < 1000) return;
  const rd = document.getElementById('rd');
  let depth = 0;
  if (rd){ const r = rd.getBoundingClientRect();
    depth = Math.min(1, Math.max(0, (r.bottom - r.top) ? (innerHeight - Math.max(0, r.top)) / (r.bottom - r.top) : 0)); }
  try{ await call('log_event', { kind:'dwell', repoId:curDetail.id, payload: JSON.stringify({ ms, readDepth:+depth.toFixed(2) }) }); }catch(e){}
  J(`dwell ${curDetail.id} ${ms}ms depth=${depth.toFixed(2)}`);
  dwellStart = Date.now();
}

let DEV = null, pollTimer = 0;
async function loginDev(btn){
  const cid = (SET.client_id||'').trim();
  const st = document.getElementById('devst');
  if (!cid) { st.textContent='先填 client_id'; return; }
  btn.disabled = true; st.textContent='申请设备码…';
  try{
    const v = await call('login_start', { clientId: cid, scopes: SET.scopes || 'read:user public_repo' });
    DEV = { code: v.device_code, interval: v.interval || 5, deadline: Date.now() + (v.expires_in||900)*1000 };
    st.textContent='';
    document.getElementById('devbox').innerHTML = `<div class="panel">
      <div class="ds">在浏览器里打开 <a href="${esc(v.verification_uri)}" target="_blank" rel="noreferrer">${esc(v.verification_uri)}</a>
        （或 ${esc(v.verification_uri_complete||'')}），输入这个一次性代码：</div>
      <div style="font-size:26px;letter-spacing:3px;font-weight:700;margin:8px 0">${esc(v.user_code)}</div>
      <div class="sub">代码 ${Math.round((v.expires_in||900)/60)} 分钟内有效 · 授权后本窗口会自动继续 · <span id="pollst">等待授权…</span></div>
      <button class="more" onclick="copyCode('${esc(v.user_code)}')">复制代码</button>
      <button class="more" onclick="stopPoll()">取消</button></div>`;
    J('device_start ok interval=' + DEV.interval);
    poll();
  }catch(e){ st.textContent='失败：' + e; J('device_start FAIL '+e); }
  btn.disabled = false;
}
function copyCode(t){ try{ navigator.clipboard.writeText(t); }catch(e){} }
function stopPoll(){ if(pollTimer) clearTimeout(pollTimer); pollTimer=0; const p=document.getElementById('pollst'); if(p) p.textContent='已取消'; DEV=null; }
async function poll(){
  if (!DEV) return;
  const p = document.getElementById('pollst');
  if (Date.now() > DEV.deadline) { if(p) p.textContent='代码已过期，重新点开始登录'; stopPoll(); return; }
  let r;
  try{ r = await call('login_poll', { clientId:(SET.client_id||'').trim(), deviceCode: DEV.code }); }
  catch(e){ if(p) p.textContent='轮询出错：'+e; DEV=null; return; }
  if (r.state === 'pending') { if(p) p.textContent='还在等你在浏览器里授权…'; pollTimer = setTimeout(poll, DEV.interval*1000); return; }
  if (r.state === 'slow_down') { DEV.interval += 5; pollTimer = setTimeout(poll, DEV.interval*1000); return; }
  if (r.state !== 'ok') { if(p) p.textContent='登录未完成：' + (r.state||r.error||'?'); stopPoll(); return; }
  stopPoll();
  if(p) p.textContent='已登录 @' + r.login;
  document.getElementById('meta').innerHTML = '登录成功：<b>@'+esc(r.login)+'</b>。现在点"建我的画像"，推荐就会按你的口味重算。';
  J('login ok '+r.login);
  SET.has_token = true; renderAccounts();
}

    <div class="set"><div>校准<small>按通道/窗口/语言/降权分桶统计命中率，样本不足 20 的桶不生效。</small></div>
      <button class="more" onclick="calib(this)">重新校准</button></div>
    <div class="set"><div>数据库<small>${esc((window.__S&&window.__S.db)||'')}</small></div>
      <button class="more" onclick="load()">重新读取</button></div>
  </div>`;
  renderAccounts();
}

(async function boot(){
  try{ if (T) SET = Object.assign(SET, await call('settings_json', {})); }catch(e){ J('settings FAIL '+e); }
  applyTheme(); tabs(); load();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (SET.theme==='system') applyTheme(); });
})();
</script>
