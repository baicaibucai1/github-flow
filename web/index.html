<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flow · 发现 GitHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand"><span class="mark"></span><span>Flow</span></div>
  <nav class="tabs">
    <button class="tab on" data-view="feed">发现</button>
    <button class="tab" data-view="saved">收藏<i id="savedn"></i></button>
  </nav>
  <div class="stat" id="pool"></div>
</header>

<main id="feed" class="feed"></main>
<main id="savedview" class="feed" hidden></main>

<div id="hint" class="hint">正在打开本地库…</div>
<div id="fatal" class="fatal" hidden></div>

<div id="mask" class="mask" hidden></div>
<aside id="drawer" class="drawer" hidden></aside>

<script type="module" src="app.js"></script>
</body>
</html>
